apiVersion: v1
kind: Service
metadata:
  name: fleetman-webapp
spec:
  #Defines which pods are going to be reprensented by this service.
  selector: 
    damonxApp: webapp
  
  ports:
    - name: http
      port: 80
      nodePort: 30080
        
  type: NodePort   
--- 
apiVersion: v1
kind: Service
metadata:
  name: fleetman-queue
spec:
  #Defines which pods are going to be reprensented by this service.
  selector: 
    app: queue
  ports:
    - name: http
      port: 8161
      nodePort: 30010
        
  type: NodePort
